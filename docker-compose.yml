# Local, reproducible PostgreSQL for development and tests. No cloud account,
# no paid service. Port 5433 avoids clashing with a system Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: scheduler-pg-dev
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - scheduler_pgdata:/var/lib/postgresql/data

volumes:
  scheduler_pgdata:
